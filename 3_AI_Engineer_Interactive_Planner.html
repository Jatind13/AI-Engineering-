<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Engineer Planner: 40-week tracker</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#F5F7FB; --grid:rgba(26,34,56,.05); --surface:#FFFFFF; --surface2:#EDF0F8;
  --ink:#1A2238; --muted:#566079; --line:#D6DCEA; --on:#FFFFFF;
  --p1:#2563EB; --p2:#7C3AED; --p3:#0D9488; --p4:#EA580C; --p5:#DB2777; --p6:#A16207; --p7:#15803D; --p8:#B91C1C;
  --font-head:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1526; --grid:rgba(232,236,248,.045); --surface:#172036; --surface2:#1F2A48;
    --ink:#E8ECF8; --muted:#A3AECB; --line:#2C3759; --on:#0F1526;
    --p1:#60A5FA; --p2:#A78BFA; --p3:#2DD4BF; --p4:#FB923C; --p5:#F472B6; --p6:#FBBF24; --p7:#4ADE80; --p8:#F87171;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:15px/1.5 var(--font-body);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.head-font{font-family:var(--font-head)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.brand h1{font:700 21px/1.1 var(--font-head);letter-spacing:.2px}
.brand p{font-size:12.5px;color:var(--muted);margin-top:2px}
.stats{display:flex;gap:18px;flex-wrap:wrap;flex:1;min-width:260px}
.stat b{display:block;font:700 20px/1.1 var(--font-head);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.ctrl input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--ink)}
.btn.warn{border-color:var(--p8);color:var(--p8)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.cell:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--ink) 40%,transparent);outline-offset:2px}
.overall{height:3px;background:var(--line)}
.overall i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.save{font-size:12px;color:var(--muted)}
.plan-note{font-size:12.5px;color:var(--muted)}
.plan-note b{color:var(--ink)}

/* ---------- layout ---------- */
.shell{max-width:1200px;margin:0 auto;padding:20px 16px 70px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:26px}
.rail{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 112px);overflow:auto;padding-right:4px}
.rail summary{display:none;cursor:pointer;font:700 16px var(--font-head);padding:8px 0}
.rph{margin-bottom:16px;--ph:var(--p1)}
.rph h3{font:700 14px/1.25 var(--font-head);color:var(--ph);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.rph h3 small{font:500 12px var(--font-body);color:var(--muted);white-space:nowrap}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.chip{position:relative;height:42px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;padding:0;overflow:hidden;font:700 14px var(--font-head);text-align:left;padding:5px 7px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ph)}
.chip .fill{position:absolute;left:0;bottom:0;height:5px;background:var(--ph);width:var(--f,0%)}
.chip.sel{border-color:var(--ph);box-shadow:0 0 0 2px var(--ph)}
.chip.full{background:var(--ph);color:var(--on);border-color:var(--ph)}
.chip.full .fill{display:none}
.chip .now{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.chip.full .now{background:var(--on)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;font:700 15px var(--font-head);color:var(--muted)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- week sheet ---------- */
.wk-head{--f:0;display:grid;grid-template-columns:1fr auto;gap:16px;padding:18px 20px;border:1px solid color-mix(in srgb,var(--ph) 40%,var(--line));border-left:8px solid var(--ph);border-radius:10px;background:color-mix(in srgb,var(--ph) 11%,var(--surface))}
.wk-no{font:700 15px var(--font-head);color:var(--ph)}
.wk-head h2{font:700 27px/1.15 var(--font-head);margin:2px 0 6px}
.wk-head .ph{font-size:13px;color:var(--muted);margin-top:2px}
.goal{max-width:70ch;font-size:14.5px}
.ring{width:70px;height:70px;border-radius:50%;background:conic-gradient(var(--ph) calc(var(--f)*1%),var(--line) 0);display:grid;place-items:center}
.ring b{width:54px;height:54px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 15px var(--font-head);font-variant-numeric:tabular-nums}
.wk-nav{display:flex;justify-content:space-between;gap:8px;margin:12px 0}
.day{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ph);border-radius:10px;padding:12px 14px}
.day.done{background:color-mix(in srgb,var(--ph) 6%,var(--surface))}
.day.today{box-shadow:0 0 0 3px color-mix(in srgb,var(--ph) 40%,transparent)}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.day-h h3{font:700 17px var(--font-head)}
.day-h .date{font-size:13px;color:var(--muted)}
.day-h .tdy{font-size:12px;font-weight:600;color:var(--ph)}
.day-h .btn{margin-left:auto;padding:3px 9px;font-size:12.5px}
.blocks{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:10px}
.blk{display:block;border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:pointer;background:var(--surface)}
.blk:hover{border-color:color-mix(in srgb,var(--ph) 60%,var(--line))}
.blk.done{background:color-mix(in srgb,var(--ph) 10%,var(--surface));border-color:color-mix(in srgb,var(--ph) 45%,var(--line))}
.blk-top{display:flex;align-items:center;gap:8px;font:700 13.5px var(--font-head)}
.blk-top .hrs{font:500 12.5px var(--font-body);color:var(--muted);margin-left:auto}
.blk p{margin-top:6px;font-size:13.8px;line-height:1.45}
.blk.done p{color:var(--muted)}
.res{display:inline;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--ph) 13%,transparent);color:var(--muted);font-size:12.8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
input.ck{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;flex:none;border:2px solid var(--ph,var(--ink));border-radius:5px;background:transparent;display:inline-grid;place-content:center;cursor:pointer}
input.ck::after{content:"";width:5px;height:10px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .12s;margin-top:-2px}
input.ck:checked{background:var(--ph,var(--ink))}
input.ck:checked::after{transform:rotate(45deg) scale(1)}
input.ck:focus-visible{outline:3px solid color-mix(in srgb,var(--ph,var(--ink)) 45%,transparent);outline-offset:2px}
.sat{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-top:12px;border:1px dashed var(--line);border-radius:10px;background:var(--surface2);cursor:pointer}
.sat.done{background:color-mix(in srgb,var(--ph) 8%,var(--surface2))}
.sat p{font-size:14px}
details.ud{margin-top:12px;background:color-mix(in srgb,var(--p4) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--p4) 40%,var(--line));border-radius:10px;padding:10px 14px}
details.ud summary{cursor:pointer;font:700 14px var(--font-head)}
details.ud p{margin-top:6px;font-size:13.8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h3{font:700 16px var(--font-head);margin-bottom:8px;color:var(--ph,var(--ink))}
.tick{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:14px}
.tick.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.num{font-size:12.5px;color:var(--muted)}
.num div{display:flex;align-items:center;margin-top:3px}
.num button{width:30px;height:32px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:16px;line-height:1}
.num button:first-child{border-radius:6px 0 0 6px}.num button:last-child{border-radius:0 6px 6px 0}
.num input{width:100%;min-width:0;height:32px;text-align:center;border:1px solid var(--line);border-left:0;border-right:0;background:var(--surface);font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)}

/* ---------- overview ---------- */
.sec{margin-bottom:22px}
.sec h2{font:700 21px var(--font-head);margin-bottom:4px}
.sec .sub{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.pbars{display:grid;gap:8px}
.pbar{display:grid;grid-template-columns:minmax(0,260px) 1fr 112px;gap:12px;align-items:center;font-size:14px;--ph:var(--p1)}
.pbar .t{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar .t i{display:block;height:100%;background:var(--ph);width:var(--f)}
.pbar small{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dsa{display:grid;grid-template-columns:repeat(auto-fill,minmax(15px,1fr));gap:3px;max-width:760px}
.dsa i{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.dsa i.on{background:var(--p8);border-color:var(--p8)}
.dsa i.ms{outline:2px solid var(--ink);outline-offset:1px}
.mslist{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:13.5px}
.mslist .hit{font-weight:700;color:var(--p7)}
.cons-wrap{overflow-x:auto;padding-bottom:6px}
.cons{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,18px);grid-auto-columns:18px;gap:3px;min-width:max-content}
.cell{width:18px;height:18px;border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:0;cursor:pointer;--ph:var(--p1)}
.cell.on{background:var(--ph);border-color:var(--ph)}
.cell.now{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14px}

/* ---------- courses ---------- */
.filter{width:100%;max-width:420px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-bottom:12px}
.course{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.course .code{font:700 17px var(--font-head);color:var(--p4)}
.course h4{font:700 15px/1.3 var(--font-body)}
.course .by{font-size:13px;color:var(--muted);margin:1px 0 4px}
.course p{font-size:13.8px}
.resgrp{margin-bottom:14px}
.resgrp h4{font:700 15px var(--font-head);margin-bottom:4px;color:var(--p1)}
.resgrp ul{margin:0;padding-left:18px;font-size:13.8px}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width: 860px){
  .shell{grid-template-columns:1fr}
  .top{position:static}
  .rail{position:static;max-height:none;overflow:visible;padding:0}
  .rail summary{display:block}
  .blocks,.two,.cols3{grid-template-columns:1fr}
  .wk-head{grid-template-columns:1fr}
  .ring{display:none}
  .pbar{grid-template-columns:1fr 112px}.pbar .t{grid-column:1 / -1;order:3}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  .top,.rail,.tabs,.wk-nav,.ctrl,.toast,.day-h .btn,.num button{display:none!important}
  body{background:#fff;color:#000}.shell{display:block;padding:0}.day,.panel{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>AI Engineer Planner</h1><p>40 weeks. 4 hours a day. Tick as you go.</p></div>
    <div class="stats" id="stats"></div>
    <div class="ctrl">
      <label>Plan starts <input type="date" id="start" aria-label="Plan start date"></label>
      <button class="btn" id="today" hidden>Go to today</button>
      <button class="btn" id="export">Export</button>
      <button class="btn" id="import">Import</button>
      <button class="btn" id="print">Print week</button>
      <button class="btn" id="reset">Reset</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
    <div class="plan-note" id="plan" aria-live="polite"></div>
    <div class="save" id="save"></div>
  </div>
  <div class="overall" aria-hidden="true"><i id="overall"></i></div>
</header>

<div class="shell">
  <details class="rail" id="rail" open>
    <summary>All 40 weeks</summary>
    <nav id="rail-body" aria-label="Weeks"></nav>
  </details>
  <main>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-act="tab" data-tab="week">Week</button>
      <button class="tab" role="tab" data-act="tab" data-tab="overview">Overview</button>
      <button class="tab" role="tab" data-act="tab" data-tab="courses">Courses and resources</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const D = {"phases": [{"id": 1, "name": "Python, Software Eng. & FastAPI", "range": "W1-6"}, {"id": 2, "name": "Math, ML & Deep Learning basics", "range": "W7-10"}, {"id": 3, "name": "LLM App Engineering", "range": "W11-14"}, {"id": 4, "name": "RAG & Vector Databases", "range": "W15-20"}, {"id": 5, "name": "Agents: LangChain, LangGraph, MCP", "range": "W21-26"}, {"id": 6, "name": "Hugging Face, Fine-tuning & Serving", "range": "W27-30"}, {"id": 7, "name": "Production, Cloud & Flagship Project", "range": "W31-34"}, {"id": 8, "name": "Interview Sprint (DSA, LLD, HLD, mocks)", "range": "W35-40"}], "weeks": [{"n": 1, "phase": 1, "title": "Setup + Python core refresh", "goal": "A clean dev environment, Git fluency, and tight Python fundamentals (you already know some, so move fast but write code daily).", "deliverable": "GitHub repo 'ai-eng-journey' with daily-log.md + CLI expense tracker (JSON storage, tested with pytest).", "checks": ["Explain mutable vs immutable, and why default list args are a bug", "Use venv/uv, git branch, commit, PR without help", "Write a function with *args/**kwargs and a closure"], "labels": ["A: Learn (2h)", "B: Build / practice (1h)", "C: DSA (1h)"], "rows": [["Dev setup: install Python 3.12+, uv, VS Code, ruff. Git basics [Pro Git book ch 1-3 | learngitbranching.js.org first 3 levels]", "Create GitHub repo 'ai-eng-journey'; commit README + daily-log.md; add pytest 'hello world' + ruff config", "Setup: LeetCode + NeetCode accounts. Big-O primer [NeetCode 'Big-O' lesson]. Solve: Contains Duplicate, Valid Anagram"], ["Core types, slicing, mutability, truthiness, f-strings, loops [CS50P lectures 0-2 | docs.python.org/3/tutorial ch 3-5]", "10 small exercises [Exercism Python track: 'Easy' set]; commit each", "Two Sum, Group Anagrams. Learn the hashmap 'complement' pattern"], ["Functions: args/kwargs, scope, closures, lambda, modules & imports [CS50P lecture 3-4 | Real Python 'Defining Your Own Python Function']", "Write utils.py (5 helpers) + py document.addEventListener("keydown", e => {
  if (S.tab !== "week" || e.target.matches("input,textarea,select") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowLeft") go(S.lastWeek - 1, false); else if (e.key === "ArrowRight") go(S.lastWeek + 1, false);
});
$("#today").addEventListener("click", () => { const t = todayInfo(); if (t && !t.before) go(Math.min(40, t.wk)); });
$("#print").addEventListener("click", () => { S.tab = "week"; render(false); window.print(); });
$("#export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "ai-engineer-planner-progress-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Progress file downloaded");
});
$("#import").addEventListener("click", () => $("#file").click());
let resetArm;
$("#reset").addEventListener("click", ev => {
  const b = ev.currentTarget;
  if (!b.classList.contains("warn")){ b.classList.add("warn"); b.textContent = "Click again to erase all"; resetArm = setTimeout(() => { b.classList.remove("warn"); b.textContent = "Reset"; }, 4000); return; }
  clearTimeout(resetArm); b.classList.remove("warn"); b.textContent = "Reset";
  S = {v:1, start:"", checks:{}, notes:{}, solved:{}, failed:{}, hours:{}, lastWeek:1, tab:"week"}; $("#start").value = ""; save(); render(false); toast("Progress erased");
});

/* ---------- start ---------- */
(async function init(){
  await load();
  $("#start").value = S.start || "";
  if (!S.checks || Object.keys(S.checks).length === 0){
    if (!S.lastWeek) S.lastWeek = 1;
  }
  const rail = $("#rail");
  if (window.matchMedia("(max-width: 860px)").matches) rail.removeAttribute("open");
  window.matchMedia("(max-width: 860px)").addEventListener("change", m => { if (!m.matches) rail.setAttribute("open",""); });
  saveStatus(); render(false);
})();
</script>
</body>
</html>
